name: ci

on:
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v3
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   name: Java Kompilieren
                run: ./gradlew compileJava

    test:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-java@v3
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   name: JUnit-Tests ausführen
                run: ./gradlew test

    format:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-java@v3
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   name: Spotless Check
                run: ./gradlew spotlessCheck
